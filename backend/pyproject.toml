[project]
name = "packet-sniffer"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scapy.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.parser"
disable_error_code = ["attr-defined"]
